name: androidx_biometric
description: AndroidX Biometric bindings generated by bindsmith (JVM driver + Maven).
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  bindsmith_runtime:
    path: ../../packages/bindsmith_runtime
  jni: ^1.0.3

dev_dependencies:
  bindsmith:
    path: ../../packages/bindsmith
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
