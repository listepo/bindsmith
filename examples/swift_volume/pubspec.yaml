name: swift_volume
description: Swift-only SwiftPM VolumeKit bindings generated by bindsmith (wrapper path).
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  bindsmith_runtime:
    path: ../../packages/bindsmith_runtime
  objective_c: ^9.6.0

dev_dependencies:
  bindsmith:
    path: ../../packages/bindsmith
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
