version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  bindsmith_runtime:
    path: ../../packages/bindsmith_runtime
  code_assets: ^2.0.0
  ffi: ^2.2.0
  objective_c: ^9.6.0
  hooks: ^2.2.0
  native_toolchain_c: ^0.19.4

dev_dependencies:
  bindsmith:
    path: ../../packages/bindsmith
  flutter_lints: ^6.0.0
