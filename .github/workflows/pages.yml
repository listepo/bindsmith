name: site

# Build check for the site. It is no longer published to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/brand/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/brand/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Activate jaspr_cli
        run: dart pub global activate jaspr_cli

      - name: Resolve site dependencies
        working-directory: site
        run: dart pub get

      - name: Build static site
        working-directory: site
        run: jaspr build

      - name: Check build output
        run: |
          cd site/build/jaspr
          test -s index.html || { echo "missing index.html" >&2; exit 1; }
          grep -q 'One YAML' index.html
          grep -q 'bindsmith' index.html
          test -f styles/tokens.css
          test -f styles/landing.css
          test -f images/logo.svg
          test -f favicon.svg
          # served under the /bindsmith/ subpath
          grep -qE 'base[^>]+href="/bindsmith/"' index.html
          echo "site ok: $(find . -name '*.html' | wc -l) html file(s)"
