name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dart:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # macOS and Linux install the toolchain from mise.toml, like a dev machine.
      - uses: jdx/mise-action@v2
        if: runner.os != 'Windows'
        with:
          install: true
          cache: true
      - uses: dart-lang/setup-dart@v1
        if: runner.os == 'Windows'
        with:
          sdk: 3.13.1
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: 24
      - name: libclang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: libclang (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm --no-progress -y
      - run: dart pub get
      - run: npm ci
        working-directory: packages/bindsmith/tool/ts_sidecar
      - run: dart format --output=none --set-exit-if-changed packages fixtures
      - run: dart analyze --fatal-infos
      - run: dart test
        working-directory: packages/bindsmith_runtime
      - run: dart test
        working-directory: packages/bindsmith
      - run: node --test
        working-directory: packages/bindsmith/tool/ts_sidecar
      - name: generated fixtures compile
        run: dart analyze --fatal-infos fixtures
      - name: Release artefacts
        run: sh tests/release_artefacts.sh

  pana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.1
      - run: dart pub get
      - run: dart pub global activate pana
      - name: pana bindsmith
        run: dart pub global run pana --no-warning --exit-code-threshold 140 packages/bindsmith
      - name: pana bindsmith_runtime
        run: dart pub global run pana --no-warning --exit-code-threshold 140 packages/bindsmith_runtime

  examples:
    name: example ${{ matrix.example }} ${{ matrix.build }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            example: avfoundation_audio
            build: macos
          - os: macos-latest
            example: avfoundation_audio
            build: ios
          - os: macos-latest
            example: swift_volume
            build: macos
          - os: macos-latest
            example: swift_volume
            build: ios
          - os: macos-latest
            example: sqlite_desktop
            build: macos
          - os: ubuntu-latest
            example: sqlite_desktop
            build: linux
          - os: ubuntu-latest
            example: androidx_biometric
            build: apk
          - os: ubuntu-latest
            example: chartjs_web
            build: web
          - os: windows-latest
            example: sqlite_desktop
            build: windows
          - os: ubuntu-latest
            example: dbus_greeter
            build: linux
          - os: windows-latest
            example: win32_tickcount
            build: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}/example
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        if: matrix.build == 'apk'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        if: matrix.build == 'apk'
      - name: Linux desktop toolchain
        if: matrix.build == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
        working-directory: .
      - name: SQLite amalgamation
        if: matrix.example == 'sqlite_desktop'
        run: sh examples/sqlite_desktop/tool/fetch_sqlite.sh
        working-directory: .
      - name: Enable desktop
        if: matrix.build == 'linux' || matrix.build == 'windows' || matrix.build == 'macos'
        run: flutter config --enable-${{ matrix.build }}-desktop
      - name: Prefer CocoaPods for Apple ffi plugins
        if: matrix.build == 'macos' || matrix.build == 'ios'
        run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
      - name: flutter build macos
        if: matrix.build == 'macos'
        run: flutter build macos --debug
      - name: flutter build ios
        if: matrix.build == 'ios'
        run: flutter build ios --simulator --debug --no-codesign
      - name: flutter build linux
        if: matrix.build == 'linux'
        run: flutter build linux --debug
      - name: flutter build windows
        if: matrix.build == 'windows'
        run: flutter build windows --debug
      - name: flutter build apk
        if: matrix.build == 'apk'
        run: flutter build apk --debug
      - name: flutter build web
        if: matrix.build == 'web'
        run: flutter build web --debug
