name: ci

on:
  # Push to main, non-draft pull requests and the weekly schedule run this through
  # pipeline.yml (`workflow_call`), in parallel with the other checks and behind its `gate` job.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dart:
    if: github.event.pull_request.draft != true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # macOS and Linux install the toolchain from mise.toml, like a dev machine.
      - uses: jdx/mise-action@v4
        if: runner.os != 'Windows'
        with:
          install: true
          cache: true
      - uses: dart-lang/setup-dart@v1
        if: runner.os == 'Windows'
        with:
          sdk: 3.13.1
      - uses: actions/setup-node@v7
        if: runner.os == 'Windows'
        with:
          node-version: 24
      - name: libclang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: libclang (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm --no-progress -y
      - run: dart pub get
      - run: npm ci
        working-directory: packages/bindsmith/tool/ts_sidecar
      - run: dart format --output=none --set-exit-if-changed packages fixtures
      - run: dart analyze --fatal-infos
      - run: dart test
        working-directory: packages/bindsmith_runtime
      - run: dart test
        working-directory: packages/bindsmith
      - run: node --test
        working-directory: packages/bindsmith/tool/ts_sidecar
      - name: generated fixtures compile
        run: dart analyze --fatal-infos fixtures
      - name: Release artefacts
        run: sh tests/release_artefacts.sh

  pana:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.1
      - run: dart pub get
      - run: dart pub global activate pana
      - name: pana bindsmith
        run: dart pub global run pana --no-warning --exit-code-threshold 140 packages/bindsmith
      - name: pana bindsmith_runtime
        run: dart pub global run pana --no-warning --exit-code-threshold 140 packages/bindsmith_runtime

  examples:
    if: github.event.pull_request.draft != true
    name: example ${{ matrix.example }} ${{ matrix.build }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            example: avfoundation_audio
            build: macos
          - os: macos-latest
            example: avfoundation_audio
            build: ios
          - os: macos-latest
            example: swift_volume
            build: macos
          - os: macos-latest
            example: swift_volume
            build: ios
          - os: macos-latest
            example: sqlite_desktop
            build: macos
          - os: ubuntu-latest
            example: sqlite_desktop
            build: linux
          - os: ubuntu-latest
            example: androidx_biometric
            build: apk
          - os: ubuntu-latest
            example: chartjs_web
            build: web
          - os: windows-latest
            example: sqlite_desktop
            build: windows
          - os: ubuntu-latest
            example: dbus_greeter
            build: linux
          - os: windows-latest
            example: win32_tickcount
            build: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}/example
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - uses: actions/setup-java@v6
        if: matrix.build == 'apk'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        if: matrix.build == 'apk'
      - name: Linux desktop toolchain
        if: matrix.build == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
        working-directory: .
      - name: SQLite amalgamation
        if: matrix.example == 'sqlite_desktop'
        run: sh examples/sqlite_desktop/tool/fetch_sqlite.sh
        working-directory: .
      - name: Enable desktop
        if: matrix.build == 'linux' || matrix.build == 'windows' || matrix.build == 'macos'
        run: flutter config --enable-${{ matrix.build }}-desktop
      - name: Prefer CocoaPods for Apple ffi plugins
        if: matrix.build == 'macos' || matrix.build == 'ios'
        run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
      - name: flutter build macos
        if: matrix.build == 'macos'
        run: flutter build macos --debug
      - name: flutter build ios
        if: matrix.build == 'ios'
        run: flutter build ios --simulator --debug --no-codesign
      - name: flutter build linux
        if: matrix.build == 'linux'
        run: flutter build linux --debug
      - name: flutter build windows
        if: matrix.build == 'windows'
        run: flutter build windows --debug
      - name: flutter build apk
        if: matrix.build == 'apk'
        run: flutter build apk --debug
      - name: flutter build web
        if: matrix.build == 'web'
        run: flutter build web --debug

  revert-on-failure:
    name: revert-on-failure
    needs: [dart, pana, examples]
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && contains(join(needs.*.result, ','), 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Revert commits from this push
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No parent (new branch); skip revert"
            exit 0
          fi
          # The GITHUB_TOKEN cannot push workflow files without the
          # `workflows` permission, so a revert of a push that touched
          # .github/ would fail the push. Skip instead (least privilege:
          # no `workflows: write` granted); a human reverts those pushes.
          if ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "Base $BEFORE not present locally; skip revert"
            exit 0
          fi
          if git diff --name-only "$BEFORE".."$AFTER" | grep -q '^\.github/'; then
            echo "Push touches .github/; auto-revert cannot push workflow files — skip"
            exit 0
          fi
          subject=$(git log -1 --format=%s "$AFTER")
          author=$(git log -1 --format=%an "$AFTER")
          case "$subject" in
            "ci: auto-revert"*) echo "Already an auto-revert; skip"; exit 0 ;;
          esac
          if [ "$author" = "github-actions[bot]" ]; then
            echo "Last commit is from actions bot; skip"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          parent_count=$(git rev-list --parents -n 1 "$AFTER" | awk '{print NF}')
          if [ "$parent_count" -gt 2 ]; then
            git revert --no-edit -m 1 "$AFTER"
          else
            git revert --no-commit "$BEFORE".."$AFTER"
            if git diff --cached --quiet; then
              echo "Nothing to revert"
              exit 0
            fi
            short=$(git rev-parse --short "$AFTER")
            git commit -m "ci: auto-revert $short — main CI failed"
          fi
          git push origin HEAD:main
