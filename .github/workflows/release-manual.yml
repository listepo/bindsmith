name: release-manual

# Manual release: choose the semver bump, the workflow bumps both pubspecs,
# commits, and pushes tag `v<version>`. The `release` workflow (on tag push)
# then builds the native executables and publishes the GitHub Release.
# Run from main after CI is green.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      dry_run:
        description: 'Print the new version without committing or tagging'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  bump-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.1
      - name: Bump version
        id: bump
        run: |
          set -euo pipefail
          current=$(grep '^version: ' packages/bindsmith/pubspec.yaml | awk '{print $2}')
          echo "current: $current"
          new=$(dart scripts/bump_version.dart --bump "${{ inputs.bump }}" --current "$current")
          echo "new: $new"
          echo "tag=v$new" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.dry_run }}" = "true" ]; then exit 0; fi
          sed -i -E "s/^version: .*/version: $new/" packages/bindsmith/pubspec.yaml packages/bindsmith_runtime/pubspec.yaml
          git diff -- packages/bindsmith/pubspec.yaml packages/bindsmith_runtime/pubspec.yaml
      - name: Commit, tag, push (triggers `release` on the tag)
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/bindsmith/pubspec.yaml packages/bindsmith_runtime/pubspec.yaml
          git commit -m "chore(release): ${{ steps.bump.outputs.tag }}" || echo "nothing to commit"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin HEAD:main
          git push origin "${{ steps.bump.outputs.tag }}"
