# The only way to a release, and the only thing that creates a `v*` tag
# (pyrlyn/infra bump.yml; replaces release-manual.yml, which pushed the
# version commit to main and the tag itself). `scripts/release.sh <level>
# --local` makes one `chore(release): vX.Y.Z` commit (both pubspecs); bump
# pushes it to `release/bump-vX.Y.Z`, opens a pull request into main, waits
# for the ci.yml checks below, rebase-merges it, reads back the commit that
# landed on main, tags it, creates a draft release and dispatches release.yml
# on the tag. Red checks, a timeout or a failed merge close the pull request:
# no tag, no release. `dry-run` stops after the checks.
#
# BUMP_TOKEN: GITHUB_TOKEN cannot open pull requests here (workflow
# permissions), so this needs a PAT with contents + pull requests write in a
# `RELEASE_PLZ_TOKEN` repository secret. Without it the run fails at
# `gh pr create`, before any tag.
name: Bump and release

on:
  workflow_dispatch:
    inputs:
      level:
        description: which part of the version to raise, if the current one is already released
        default: patch
        type: choice
        options: [patch, minor, major]
      dry-run:
        description: open the version pull request and wait for its checks, then close it
        default: false
        type: boolean
      release-untagged-head:
        description: release the untagged version already on main (nothing to commit) as it stands
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  bump:
    uses: pyrlyn/infra/.github/workflows/bump.yml@a4f93a2606a5dd8f697ad3d876440ab3e2eb4ae9 # main
    permissions:
      contents: write # the bump branch, the tag and the release
      pull-requests: write # merge or close the bump pull request
      actions: write # dispatch release.yml and ci.yml
      checks: read # wait for the checks
      statuses: read
      issues: write # notify-failure: a failed run opens a release-failure issue
    with:
      level: ${{ inputs.level }}
      dry-run: ${{ inputs.dry-run }}
      release-untagged-head: ${{ inputs.release-untagged-head }}
      release-script: scripts/release.sh
      mise-install-args: dart
      ci-workflows: ci.yml
      # main's ruleset requires a pull request but no status checks, so name them.
      required-checks: |
        dart (macos-latest)
        dart (ubuntu-latest)
        dart (windows-latest)
        pana
      release-workflows: release.yml
    secrets:
      BUMP_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
