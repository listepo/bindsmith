name: release

# Native `dart compile exe` per OS. Cross-compile only targets Linux, so each
# runner builds its own host. Does not `dart pub publish` — that stays a
# creator step. Never tags and never starts itself: bump.yml (the only tagger)
# creates the tag and a draft release on the commit that landed on main, then
# dispatches this with `--ref <tag> -f tag=<tag>`; this uploads the binaries
# and publishes the draft.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag bump.yml created (vX.Y.Z); run with --ref <tag>
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: bindsmith-macos-arm64
          - os: ubuntu-latest
            asset: bindsmith-linux-x64
          - os: windows-latest
            asset: bindsmith-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.1
      - run: dart pub get
      - name: Compile
        run: dart compile exe packages/bindsmith/bin/bindsmith.dart -o ${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Flatten artefacts
        run: |
          mkdir -p assets
          find dist -type f -exec mv {} assets/ \;
          ls -l assets
      - name: Upload to bump's release and publish it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag_sha="$(git ls-remote origin "refs/tags/${TAG}^{commit}" | awk '{print $1; exit}')"
          [ -n "$tag_sha" ] || tag_sha="$(git ls-remote origin "refs/tags/${TAG}" | awk '{print $1; exit}')"
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "$TAG is ${tag_sha:-missing}, this run is $GITHUB_SHA: dispatch with --ref $TAG" >&2
            exit 1
          fi
          gh release view "$TAG" --json tagName >/dev/null \
            || { echo "no release $TAG: start releases with bump.yml" >&2; exit 1; }
          gh release upload "$TAG" assets/* --clobber
          gh release edit "$TAG" --draft=false
