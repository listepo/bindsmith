<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="bindsmith">
  <!-- M3 rounded-square tile (surface) -->
  <rect width="64" height="64" rx="16" fill="#1A1C1F"/>
  <!-- Soft primary-container wash behind FAB -->
  <circle cx="32" cy="32" r="22" fill="#2A2218"/>
  <!-- Material FAB (primary) -->
  <circle cx="32" cy="32" r="16" fill="#C87941"/>
  <!-- FAB elevation hint (M3 tonal rim) -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="#E8A05C" stroke-width="1.25" opacity="0.55"/>
  <!-- YAML braces monogram (on-primary) -->
  <path d="M22 22 C18.5 24.5 18.5 39.5 22 42" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M42 22 C45.5 24.5 45.5 39.5 42 42" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bind dot (secondary cue, not Flutter bird) -->
  <circle cx="32" cy="32" r="2.4" fill="#1A1C1F"/>
  <circle cx="32" cy="32" r="1.15" fill="#F5E6D4"/>
</svg>
