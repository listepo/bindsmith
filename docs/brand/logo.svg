<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="bindsmith">
  <!-- M3 ink rounded-square tile -->
  <rect width="64" height="64" rx="16" fill="#1A1C1F"/>
  <!-- Soft primary-container wash -->
  <rect x="8" y="8" width="48" height="48" rx="14" fill="#2A2218"/>
  <!-- B stem: vertical stadium (M3 shape) -->
  <rect x="16" y="14" width="12" height="36" rx="6" fill="#C87941"/>
  <!-- Upper bowl: circle (tonal copper) -->
  <circle cx="36" cy="24" r="10" fill="#C87941"/>
  <circle cx="36" cy="24" r="4.75" fill="#1A1C1F"/>
  <!-- Lower bowl: slightly larger circle (lighter tonal) -->
  <circle cx="38" cy="42" r="12" fill="#E8A05C"/>
  <circle cx="38" cy="42" r="5.5" fill="#1A1C1F"/>
  <!-- Stem overlap hide (keep B counters clean on ink) -->
  <rect x="22" y="20" width="6" height="8" fill="#C87941"/>
  <rect x="22" y="36" width="8" height="12" fill="#E8A05C"/>
</svg>
