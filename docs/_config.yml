# GitHub Pages, served from /docs on the default branch (Settings → Pages →
# Source: Deploy from a branch, folder /docs). Nothing is built locally and
# nothing is installed: Jekyll is what Pages already runs, and a theme it
# already ships costs one line.
title: bindsmith
description: One config, six Flutter platforms.
theme: jekyll-theme-primer
exclude:
  # Working material, not documentation: raw agent reports and fact-check logs.
  - research-raw/
