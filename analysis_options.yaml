include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    # Emitter goldens import binding libraries that do not exist; the fixtures
    # package has its own analysis_options.yaml and analyzes generated code.
    - "**/*.g.dart"
    # Flutter example apps and the Jaspr site resolve Flutter/Jaspr packages the root
    # workspace does not have; the `examples` job and pages.yml build and analyze them.
    - "examples/**"
    - "site/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
