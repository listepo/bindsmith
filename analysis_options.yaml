include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    # Emitter goldens import binding libraries that do not exist; the fixtures
    # package has its own analysis_options.yaml and analyzes generated code.
    - "**/*.g.dart"
    # Flutter apps outside the pub workspace: each has its own pubspec and
    # analysis_options.yaml and is built by its own job (examples, pages).
    - "examples/**"
    - "site/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
